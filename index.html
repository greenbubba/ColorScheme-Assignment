<!DOCTYPE html>
<html>
<head>
	<title></title>
<style>
	table {
		border-collapse: collapse;
	}
	th, td {
		border: 1px solid black;
		padding: 10px;
	}
	th {
		font-size: 20px;
		font-weight: bold;
	}
</style>
</head>
	<body>
		<h1>Cloudy Sky (Picture I took)</h1>
		<img src="image.jpg" width="400">
	<table>
		<tr>
		<th colspan="4">Clouds</th>
	</tr>
		<tr>
		<td style="background-color:rgb(255,255,255);">Sun</td>
			<td style="background-color:rgb(103,118,137);">Darkest Cloud</td>
			<td style="background-color:hsl(0,0%,67.84%);">Lighter Cloud</td>
			<td style="background-color:hsl(28.47,60.82%,80.98%);">Lightest Cloud</td>
		</tr>
	<tr>
		<td>#FFFFFF</td>
		<td>#677689</td>
		<td>#ADADAD</td>
		<td>#ECCDB1</td>
	</tr>
		
	<tr>
		<td>rgb(255, 255, 255)</td>
		<td>rgb(103, 118, 137)</td>
		<td>rgb(173, 173, 173)</td>
		<td>rgb(236, 205, 177)</td>
	</tr>
	
	<tr>
		<td>hsl(0, 0%, 100%)</td>
		<td>hsl(213.53, 14.17%, 47.06%)</td>
		<td>hsl(0, 0%, 67.84%)</td>
		<td>hsl(28.47, 60.82%, 80.98%)</td>
	</tr>
	</table>
	</body>
</html>
